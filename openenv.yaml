spec_version: 1
name: openenv-bug-triage
type: environment
runtime: docker
app: server/app.py
port: 7860

tasks:
  - id: validity-check-v1
    difficulty: easy
    description: "25 reports, classify verdict + severity + team"
    grader: tasks/validity_check/grader.py

  - id: severity-routing-v1
    difficulty: medium
    description: "25 reports, emphasis on correct severity routing"
    grader: tasks/severity_routing/grader.py

  - id: full-triage-v1
    difficulty: hard
    description: "25 reports, full action space including needs_repro"
    grader: tasks/full_triage/grader.py
