spec_version: 1
name: openenv-bug-triage
type: environment
runtime: docker
app: server/app.py
port: 7860

tasks:
  - id: validity-check-v1
    difficulty: easy
    description: "Classify bug reports as valid/duplicate/needs-info/wontfix"
    grader: graders.py

  - id: severity-routing-v1
    difficulty: medium
    description: "Route bug reports with emphasis on severity classification"
    grader: graders.py

  - id: full-triage-v1
    difficulty: hard
    description: "Full triage including verdict, severity, team, needs_repro"
    grader: graders.py
