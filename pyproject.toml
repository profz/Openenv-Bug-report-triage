[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openenv-bug-triage"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "openai>=1.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.24.0",
    "rich>=13.0",
    "openenv-core>=0.2.0",
]

[project.scripts]
server = "server.app:main"

[tool.hatch.build.targets.wheel]
packages = ["env", "tasks", "agents", "server"]
